[book]
title = "Spirit Island Mastery"
authors = ["Brett Fowle"]
description = "A stats-driven strategy and learning guide for Spirit Island, synthesizing community knowledge across all expansions and paired with active-learning Claude skills."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[output.html]
git-repository-url = "https://github.com/bfowle/spirit-island"
edit-url-template = "https://github.com/bfowle/spirit-island/edit/main/{path}"
site-url = "/spirit-island/"
smart-punctuation = true
default-theme = "gruvbox"
preferred-dark-theme = "gruvbox"
additional-css = [
  "theme/css/variables.css",
  "theme/highlight.css",
  "theme/mdbook-admonish.css",
  "theme/si-icons.css",
]
additional-js = [
  "theme/gruvbox.js",
  "theme/mermaid.min.js",
  "theme/mermaid-init.js",
]
no-section-label = false

[output.html.fold]
enable = true
level = 2

[output.html.print]
enable = true
page-break = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 40
use-boolean-and = true
boost-title = 4
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true
