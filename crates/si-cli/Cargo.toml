[package]
name = "si-cli"
version.workspace = true
edition.workspace = true
description = "The one binary: replay a game log into a record and report on it."

[[bin]]
name = "si"
path = "src/main.rs"

[dependencies]
si-model = { path = "../si-model" }
si-defs = { path = "../si-defs" }
si-record = { path = "../si-record" }
si-metrics = { path = "../si-metrics" }
si-rules = { path = "../si-rules" }
si-hindsight = { path = "../si-hindsight" }
si-steam = { path = "../si-steam" }
anyhow.workspace = true
sha2 = "0.10"
regex.workspace = true
serde_json.workspace = true
comfy-table = "7"
terminal_size = "0.4"
ratatui = "0.30"
crossterm = "0.29"
