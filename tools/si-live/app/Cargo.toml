[package]
name = "si-app"
version.workspace = true
edition.workspace = true

# The native companion (and later tabletop) app for Windows: winit window,
# si-ui toolkit, the Rust core in-process (native app spec §2).

[[bin]]
name = "si-companion"
path = "src/main.rs"

[dependencies]
si-ui = { path = "../ui" }
si-common = { path = "../common" }
si-steam = { path = "../steam" }
winit = "=0.30.13"
pollster = "1"
anyhow.workspace = true
tokio.workspace = true
